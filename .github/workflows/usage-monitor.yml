name: HERE Usage Monitor

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      usage_date:
        description: "Completed UTC usage date (YYYY-MM-DD); defaults to yesterday"
        required: false
        type: string
      test_webhook:
        description: "Send a synthetic webhook test event without querying HERE"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: here-usage-monitor-generated-artifacts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HERE_REALM_ID: ${{ vars.HERE_REALM_ID }}
      HERE_AUTO_DISABLE_APP_CREDENTIALS: ${{ vars.HERE_AUTO_DISABLE_APP_CREDENTIALS }}
      HERE_LIMIT_APP_TO_WITHIN_FREE_TIER_PROJECT: ${{ vars.HERE_LIMIT_APP_TO_WITHIN_FREE_TIER_PROJECT }}
      HERE_MONITOR_ACCESS_KEY_ID: ${{ vars.HERE_MONITOR_ACCESS_KEY_ID }}
      HERE_MONITOR_ACCESS_KEY_SECRET: ${{ secrets.HERE_MONITOR_ACCESS_KEY_SECRET }}
      ALERT_WEBHOOK_URL: ${{ vars.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect and analyze usage
        run: |
          if [ "${{ inputs.test_webhook }}" = "true" ]; then
            PYTHONPATH=src python -m usage_alert.main --test-webhook
            exit 0
          fi
          args=(--fetch)
          if [ -n "${{ inputs.usage_date }}" ]; then args+=(--date "${{ inputs.usage_date }}"); fi
          PYTHONPATH=src python -m usage_alert.main "${args[@]}"
      - name: Commit generated usage outputs
        if: ${{ inputs.test_webhook != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data reports; do
            if [ -e "$path" ]; then
              git add -A "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No generated usage changes to commit."
            exit 0
          fi
          git commit -m "Update usage data and reports"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"