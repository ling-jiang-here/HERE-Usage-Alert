name: HERE Usage Monitor

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      usage_date:
        description: "Completed UTC usage date (YYYY-MM-DD); defaults to yesterday"
        required: false
        type: string
      test_webhook:
        description: "Send a synthetic webhook test event without querying HERE"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: here-usage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HERE_USAGE_API_BASE_URL: ${{ vars.HERE_USAGE_API_BASE_URL }}
      HERE_REALM_ID: ${{ vars.HERE_REALM_ID }}
      HERE_USAGE_API_CLIENT_ID: ${{ secrets.HERE_USAGE_API_CLIENT_ID }}
      HERE_USAGE_API_CLIENT_SECRET: ${{ secrets.HERE_USAGE_API_CLIENT_SECRET }}
      HERE_OAUTH_TOKEN_URL: ${{ vars.HERE_OAUTH_TOKEN_URL }}
      HERE_OAUTH_SCOPE: ${{ vars.HERE_OAUTH_SCOPE }}
      HERE_USAGE_API_USAGE_PATH: ${{ vars.HERE_USAGE_API_USAGE_PATH }}
      ALERT_WEBHOOK_URL: ${{ vars.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect and analyze usage
        run: |
          if [ "${{ inputs.test_webhook }}" = "true" ]; then
            PYTHONPATH=src python -m usage_alert.main --test-webhook
            exit 0
          fi
          args=(--fetch)
          if [ -n "${{ inputs.usage_date }}" ]; then args+=(--date "${{ inputs.usage_date }}"); fi
          PYTHONPATH=src python -m usage_alert.main "${args[@]}"