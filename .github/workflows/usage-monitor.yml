name: HERE Usage Monitor

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      usage_date:
        description: "Completed UTC usage date (YYYY-MM-DD); defaults to yesterday"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: here-usage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HERE_USAGE_API_BASE_URL: https://usage.bam.api.here.com/v2
      HERE_REALM_ID: ${{ secrets.HERE_REALM_ID }}
      HERE_USAGE_API_CLIENT_ID: ${{ secrets.HERE_USAGE_API_CLIENT_ID }}
      HERE_USAGE_API_CLIENT_SECRET: ${{ secrets.HERE_USAGE_API_CLIENT_SECRET }}
      HERE_OAUTH_TOKEN_URL: https://account.api.here.com/oauth2/token
      HERE_OAUTH_SCOPE: ${{ secrets.HERE_OAUTH_SCOPE }}
      HERE_USAGE_API_USAGE_PATH: /usage/realms/{realmId}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect and analyze usage
        run: |
          args=(--fetch)
          if [ -n "${{ inputs.usage_date }}" ]; then args+=(--date "${{ inputs.usage_date }}"); fi
          PYTHONPATH=src python -m usage_alert.main "${args[@]}"
      - name: Create or update anomaly issue
        if: success() && hashFiles('reports/*.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports').filter(name => name.endsWith('.md')).sort();
            const report = fs.readFileSync(`reports/${reports.at(-1)}`, 'utf8');
            if (report.includes('No anomaly met')) return;
            const title = `[HERE usage] ${reports.at(-1).replace('.md', '')}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'here-usage-alert'
            });
            const issue = existing.data.find(item => item.title === title);
            const body = `${report}\n\n<!-- generated by HERE Usage Monitor -->`;
            if (issue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['here-usage-alert'] });
            }
      - name: Commit curated data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated reports
          git diff --cached --quiet || git commit -m "chore: record HERE usage"
          git push
      - name: Upload redacted run output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usage-monitor-output
          path: |
            data/curated/
            reports/
          if-no-files-found: ignore
          retention-days: 14