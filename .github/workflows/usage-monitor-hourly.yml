name: HERE Usage Monitor Hourly

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: here-usage-monitor-generated-artifacts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HERE_USAGE_API_BASE_URL: ${{ vars.HERE_USAGE_API_BASE_URL }}
      HERE_REALM_ID: ${{ vars.HERE_REALM_ID }}
      HERE_USAGE_API_CLIENT_ID: ${{ secrets.HERE_USAGE_API_CLIENT_ID }}
      HERE_USAGE_API_CLIENT_SECRET: ${{ secrets.HERE_USAGE_API_CLIENT_SECRET }}
      HERE_OAUTH_TOKEN_URL: ${{ vars.HERE_OAUTH_TOKEN_URL }}
      HERE_USAGE_API_USAGE_PATH: ${{ vars.HERE_USAGE_API_USAGE_PATH }}
      ALERT_WEBHOOK_URL: ${{ vars.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check completed hour
        run: PYTHONPATH=src python -m usage_alert.main --fetch --hourly
      - name: Commit generated usage outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data reports; do
            if [ -e "$path" ]; then
              git add -A "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No generated usage changes to commit."
            exit 0
          fi
          git commit -m "Update usage data and reports"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"