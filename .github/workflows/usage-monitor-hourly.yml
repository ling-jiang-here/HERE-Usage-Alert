name: HERE Usage Monitor Hourly

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: here-usage-monitor-hourly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HERE_USAGE_API_BASE_URL: ${{ vars.HERE_USAGE_API_BASE_URL }}
      HERE_REALM_ID: ${{ vars.HERE_REALM_ID }}
      HERE_USAGE_API_CLIENT_ID: ${{ secrets.HERE_USAGE_API_CLIENT_ID }}
      HERE_USAGE_API_CLIENT_SECRET: ${{ secrets.HERE_USAGE_API_CLIENT_SECRET }}
      HERE_OAUTH_TOKEN_URL: ${{ vars.HERE_OAUTH_TOKEN_URL }}
      HERE_OAUTH_SCOPE: ${{ vars.HERE_OAUTH_SCOPE }}
      HERE_USAGE_API_USAGE_PATH: ${{ vars.HERE_USAGE_API_USAGE_PATH }}
      ALERT_WEBHOOK_URL: ${{ vars.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check completed hour
        id: hourly
        run: |
          PYTHONPATH=src python -m usage_alert.main --fetch --hourly | tee hourly-result.txt
          if grep -q "Wrote hourly anomaly report:" hourly-result.txt; then
            echo "anomaly=true" >> "$GITHUB_OUTPUT"
          else
            echo "anomaly=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create hourly anomaly issue
        if: success() && steps.hourly.outputs.anomaly == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('reports/hourly').filter(name => name.endsWith('.md')).sort();
            const reportName = reports.at(-1);
            const report = fs.readFileSync(`reports/hourly/${reportName}`, 'utf8');
            const title = `[HERE usage anomaly] ${reportName.replace('.md', '')}`;
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'here-usage-alert'
            })).data.find(item => item.title === title);
            const body = `${report}\n\n<!-- generated by HERE Usage Monitor Hourly -->`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['here-usage-alert'] });
            }